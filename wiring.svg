<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#222">Wiring – ESP32 Smart Irrigation</text>
  <text x="30" y="60" font-size="13" fill="#666">Pump with its own 5 V supply (recommended); the relay only switches the pump circuit.</text>

  <rect x="30" y="120" width="170" height="140" rx="10" fill="#eaf7ee" stroke="#27ae60" stroke-width="2"/>
  <text x="115" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#1e7e46">Soil moisture</text>
  <text x="115" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#1e7e46">sensor v1.2</text>
  <text x="115" y="184" text-anchor="middle" font-size="11" fill="#1e7e46">capacitive</text>
  <circle cx="200" cy="205" r="5" fill="#27ae60"/><text x="190" y="209" text-anchor="end" font-size="12">VCC</text>
  <circle cx="200" cy="228" r="5" fill="#27ae60"/><text x="190" y="232" text-anchor="end" font-size="12">GND</text>
  <circle cx="200" cy="251" r="5" fill="#27ae60"/><text x="190" y="255" text-anchor="end" font-size="12">AOUT</text>

  <rect x="330" y="100" width="180" height="260" rx="10" fill="#e8f0fb" stroke="#2a5caa" stroke-width="2"/>
  <text x="420" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#1d3f75">ESP32</text>
  <text x="420" y="148" text-anchor="middle" font-size="11" fill="#1d3f75">WiFi · Web · MQTT · OTA</text>
  <circle cx="330" cy="205" r="5" fill="#2a5caa"/><text x="340" y="209" font-size="12">3V3</text>
  <circle cx="330" cy="228" r="5" fill="#2a5caa"/><text x="340" y="232" font-size="12">GND</text>
  <circle cx="330" cy="251" r="5" fill="#2a5caa"/><text x="340" y="255" font-size="12">GPIO35</text>
  <circle cx="510" cy="205" r="5" fill="#2a5caa"/><text x="500" y="209" text-anchor="end" font-size="12">VIN (5 V)</text>
  <circle cx="510" cy="228" r="5" fill="#2a5caa"/><text x="500" y="232" text-anchor="end" font-size="12">GND</text>
  <circle cx="510" cy="251" r="5" fill="#2a5caa"/><text x="500" y="255" text-anchor="end" font-size="12">GPIO5</text>
  <text x="420" y="330" text-anchor="middle" font-size="11" fill="#555">powered via USB</text>

  <line x1="205" y1="205" x2="325" y2="205" stroke="#d35400" stroke-width="2.5"/>
  <line x1="205" y1="228" x2="325" y2="228" stroke="#222" stroke-width="2.5"/>
  <line x1="205" y1="251" x2="325" y2="251" stroke="#27ae60" stroke-width="2.5"/>

  <rect x="620" y="140" width="150" height="150" rx="10" fill="#fdf2e3" stroke="#e67e22" stroke-width="2"/>
  <text x="695" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#a0580f">Relay module</text>
  <text x="695" y="185" text-anchor="middle" font-size="11" fill="#a0580f">5 V, active LOW</text>
  <circle cx="620" cy="205" r="5" fill="#e67e22"/><text x="630" y="209" font-size="12">VCC</text>
  <circle cx="620" cy="228" r="5" fill="#e67e22"/><text x="630" y="232" font-size="12">GND</text>
  <circle cx="620" cy="251" r="5" fill="#e67e22"/><text x="630" y="255" font-size="12">IN</text>
  <circle cx="770" cy="215" r="5" fill="#e67e22"/><text x="760" y="219" text-anchor="end" font-size="12">COM</text>
  <circle cx="770" cy="258" r="5" fill="#e67e22"/><text x="760" y="262" text-anchor="end" font-size="12">NO</text>

  <line x1="515" y1="205" x2="615" y2="205" stroke="#d35400" stroke-width="2.5"/>
  <line x1="515" y1="228" x2="615" y2="228" stroke="#222" stroke-width="2.5"/>
  <line x1="515" y1="251" x2="615" y2="251" stroke="#2a5caa" stroke-width="2.5"/>

  <rect x="800" y="90" width="130" height="60" rx="8" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/>
  <text x="865" y="116" text-anchor="middle" font-size="13" font-weight="600">5 V supply</text>
  <text x="865" y="134" text-anchor="middle" font-size="11" fill="#555">pump only</text>
  <path d="M835 150 L835 215 L775 215" fill="none" stroke="#d35400" stroke-width="2.5"/>
  <text x="842" y="185" font-size="11" fill="#d35400">+</text>

  <circle cx="865" cy="330" r="34" fill="#e8f4fd" stroke="#2e86de" stroke-width="2"/>
  <text x="865" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e9e">Pump</text>
  <path d="M775 258 L800 258 L800 330 L831 330" fill="none" stroke="#d35400" stroke-width="2.5"/>
  <path d="M899 330 L915 330 L915 150" fill="none" stroke="#222" stroke-width="2.5"/>
  <text x="920" y="200" font-size="11" fill="#222">−</text>

  <line x1="820" y1="380" x2="910" y2="380" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="865" y="400" text-anchor="middle" font-size="11" fill="#555">Flyback diode (e.g. 1N5819)</text>
  <text x="865" y="415" text-anchor="middle" font-size="11" fill="#555">across the pump, reverse-biased</text>

  <text x="30" y="430" font-size="12" fill="#c0392b" font-weight="600">Important: do not power the pump from the ESP32's 5 V pin.</text>
  <text x="30" y="448" font-size="12" fill="#555">The pump's inrush current makes the supply voltage drop and the ESP32 resets.</text>
  <text x="30" y="466" font-size="12" fill="#555">Add a 470–1000 µF capacitor on the pump supply. The relay isolates both circuits galvanically.</text>
</svg>
